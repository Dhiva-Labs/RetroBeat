name: retro_beat
description: A local music player for Android, in the style of Samsung Music.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Playback. audio_service puts it in a foreground service so it survives
  # backgrounding and drives the lockscreen / headset controls; just_audio's
  # AudioPipeline carries the equalizer.
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.28.0

  # Reads the device's music library out of MediaStore.
  on_audio_query: ^2.9.0

  # State
  flutter_riverpod: ^2.6.1

  # Local storage: the cached library, playlists, groups and EQ presets.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  # Samples a colour from cover art to tint the player background.
  palette_generator: ^0.3.3+4

  # Permissions. device_info_plus supplies the real Android API level, which
  # decides whether audio access is READ_MEDIA_AUDIO (33+) or
  # READ_EXTERNAL_STORAGE.
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0

  # Desktop (Linux/Windows/macOS). just_audio has no desktop backend of its
  # own; just_audio_media_kit provides one over libmpv, with the platform lib
  # packages supplying the bundled libraries. macOS uses just_audio's native
  # Darwin implementation.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  window_manager: ^0.4.3

  # Desktop library scanning: folder picker plus pure-Dart tag reading, since
  # MediaStore (on_audio_query) exists only on Android.
  file_selector: ^1.0.3
  audio_metadata_reader: ^1.4.0
  path: ^1.9.0

  # Servers. Credentials go in the OS keychain (Keychain / DPAPI / libsecret),
  # never in Hive. http + xml carry the WebDAV client (PROPFIND is XML).
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  xml: ^6.5.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  # Local WebDAV server used by tests and `tool/dev_webdav_server.dart`.
  shelf: ^1.4.2

flutter:
  uses-material-design: true
