name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned: CI has no keystore, and it must not have one. This only proves
      # the release toolchain — R8 shrinking included — still builds.
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrobeat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Desktop bundles are not part of the on-every-push signal — building three
  # more OSes on every commit would triple CI time for feedback nobody is
  # waiting on. They build for an actual release tag, or on demand.
  build-linux:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libmpv-dev clang

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release bundle
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrobeat-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release bundle
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrobeat-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release bundle
        run: flutter build macos --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrobeat-macos
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: error
